{% extends "base.html" %}{% block title %}Sign up - StudyMate{% endblock %}
{% block content %}
<section class="wrap narrow"><h1 class="h2">Create your account</h1>
<form method="post" class="card form">{% csrf_token %}
  {% for f in form %}
  <label>{{ f.label }}{% if not f.field.required %} <span class="muted">(optional)</span>{% endif %}
    <input type="{{ f.field.widget.input_type }}" name="{{ f.name }}" value="{% if f.field.widget.input_type != 'password' %}{{ f.value|default:'' }}{% endif %}" {% if f.field.required %}required{% endif %}>
    {% for e in f.errors %}<em class="err">{{ e }}</em>{% endfor %}</label>
  {% endfor %}
  <button class="btn">Create account</button>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</form></section>{% endblock %}
