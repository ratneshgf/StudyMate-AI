{% extends "base.html" %}{% block title %}Log in - StudyMate{% endblock %}
{% block content %}
<section class="wrap narrow"><h1 class="h2">Welcome back</h1>
<form method="post" class="card form">{% csrf_token %}
  <label>Email<input type="email" name="email" value="{{ form.email.value|default:'' }}" autocomplete="email" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn">Log in</button>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</form></section>{% endblock %}
